flows:
- id: post
  name: Post something
  steps:
  - text: The app uploads the photo to storage, then sends the post.
    edges:
    - a-photo
    - a-lb
    - lb-post
  - text: The post service saves the post once and publishes a 'new post' event.
    edges:
    - post-store
    - post-q
  - text: Fan-out workers fetch the author's followers in batches.
    edges:
    - q-fan
    - fan-graph
  - text: They push the post's ID onto each follower's list in the feed cache, trimmed to the newest few hundred.
    edges:
    - fan-cache
  - text: For accounts with millions of followers they skip this. Those posts are merged in at read time.
    nodes:
    - fan
- id: read
  name: Open the feed
  steps:
  - text: The app asks for the feed.
    edges:
    - a-lb
    - lb-feed
  - text: The feed service reads the person's precomputed list of post IDs.
    edges:
    - feed-cache
  - text: It adds recent posts from any very large accounts they follow.
    edges:
    - feed-store
  - text: It fetches the posts for those IDs in one batch, mostly from cache.
    edges:
    - feed-store
  - text: The app shows the page and keeps a cursor for the next one.
    edges:
    - lb-feed
    - a-lb
requirements:
  features:
  - Post text and photos
  - Follow and unfollow
  - Home feed of people you follow, newest first
  - Each person's profile
  - Likes and counts
  qualities:
  - Feed loads in under 200 ms of server time
  - A new post may take seconds to reach followers
  - Staying up beats instant consistency
  - Very read-heavy
numbers:
  assumption: 'Our assumption: 200 million people a day open the feed 10 times; 100 million posts a day; 200 followers
    each on average.'
  rows:
  - what: Feed reads
    size: 23,000 a second
    how: 2 billion reads ÷ 86,400 seconds. Over 100,000 at peak.
  - what: New posts
    size: 1,200 a second
    how: 100 million ÷ 86,400.
  - what: Feed insertions
    size: 230,000 a second
    how: 'Each post copied into 200 feeds: 20 billion a day.'
  - what: Feeds in memory
    size: about 1.3 TB
    how: 800 post IDs × 8 bytes × 200 million people, before replication.
decisions:
- title: Push, except celebrities
  text: Copy post IDs into followers' feeds on write, so reads are one lookup. Pull very large accounts at read
    time instead of copying to millions.
- title: Lists of IDs
  text: Feeds hold capped lists of post IDs, not posts. Copies are cheap and each post is fetched once, from cache.
- title: Eventually consistent
  text: A post can take a few seconds to appear. People don't notice, and fan-out can run in the background.
breaks:
- what: A huge live event.
  fix: Fan-out queues back up. Add workers, serve active followers first, and let quiet feeds catch up later.
- what: A viral post's like count.
  fix: One row gets hammered. Count in sharded counters and write totals every few seconds.
- what: Replies before the post.
  fix: Fan-out lag can show a reply first. Accept it, or hold replies until the parent is visible.
companies:
- name: X (Twitter)
  text: In 2013 it served about 300,000 timeline reads a second against 6,000 writes. It fanned tweets out on write
    into Redis, each timeline capped at 800 entries on three machines, and moved very large accounts to read-time
    merging after their fan-out took minutes.
  links:
  - title: Timelines at Scale (talk)
    publisher: Raffi Krikorian, Twitter, at QCon
    year: '2013'
    url: https://www.infoq.com/presentations/Twitter-Timeline-Scalability/
    verified: true
- name: Instagram
  text: Sharded its data across PostgreSQL using thousands of logical shards, each a schema, mapped onto fewer servers
    so shards could move without re-bucketing.
  links:
  - title: Sharding & IDs at Instagram
    publisher: Instagram Engineering
    year: '2012'
    url: https://medium.com/instagram-engineering/sharding-ids-at-instagram-1cf5a71e5a5c
    verified: true
