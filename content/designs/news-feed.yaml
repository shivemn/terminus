id: news-feed
title: Design a news feed
like:
- X (Twitter)
- Instagram
- Facebook
level: core
summary: 'When someone posts, workers copy the post''s ID into a cached list for each follower, so reading a feed
  is one fast lookup. Accounts with millions of followers are the exception: their posts are merged in when a follower
  reads. Posts themselves are stored once and fetched in a batch. The hard parts are the fan-out cost, celebrity
  accounts, and keeping reads fast when they outnumber writes fifty to one.'
