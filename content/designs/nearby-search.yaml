id: nearby-search
title: Design nearby search
like:
- Tinder
- Swiggy
- Zomato
level: core
summary: The world is cut into cells, and each cell belongs to a shard that indexes only the people or places inside
  it. A search turns the circle around you into a list of cells, asks only the shards that cover them, then ranks
  what comes back. When someone moves to a new cell, they are moved to that shard. The hard parts are cities far
  busier than villages, and people who keep moving.
