id: job-scheduler
title: Design a job scheduler
like:
- Apache Airflow
- cron at scale
- Temporal
level: core
summary: Engineers describe each workflow as a graph of tasks with dependencies, in a file. A processor reads those
  files into a database; the scheduler checks which runs are due and which tasks have everything they depend on
  finished, and queues those for workers. Every task's state lives in the database, so failures can be retried and
  nothing runs twice by accident. The hard parts are dependencies, retries, and a midnight rush.
stops:
- graph-algorithms
- orchestration
- messaging
- sql
- reliability-patterns
- distributed-systems
