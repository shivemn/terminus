id: upi-payments
title: Design UPI payments
like:
- PhonePe
- Google Pay
- Paytm
- BHIM
level: core
summary: 'The app creates a payment with an idempotency key, so a retry can never charge twice. A state machine
  sends it through a partner bank to NPCI''s UPI switch, which asks the payer''s bank to debit and the payee''s
  bank to credit. Every change is appended to a ledger, and events leave through an outbox in the same transaction.
  The hard part is the payment whose bank never answers: it stays ''unknown'' until a status check or the settlement
  file decides.'
