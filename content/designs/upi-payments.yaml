flows:
- id: pay
  name: Pay a shop by QR
  steps:
  - text: The app scans the QR, shows the shop's name, and sends the payment with a new idempotency key.
    edges:
    - a-api
  - text: The API inserts the payment as CREATED. Repeating the same key returns this row instead of making another.
    edges:
    - api-sm
    - sm-db
  - text: The risk engine checks limits and fraud signals.
    edges:
    - api-risk
  - text: The person enters their UPI PIN in the bank's secure component. It is encrypted for the bank; the app's
      servers never see it.
    nodes:
    - app
  - text: The state machine marks it PENDING and sends it through the partner bank to the UPI switch.
    edges:
    - sm-psp
    - psp-npci
  - text: The payer's bank checks the PIN and debits the account; the payee's bank credits the shop.
    edges:
    - npci-payer
    - npci-payee
  - text: SUCCESS comes back. Ledger entries and an outbox event are written in one transaction.
    edges:
    - psp-npci
    - sm-psp
    - sm-db
    - db-out
  - text: The app shows the tick, and notifications go out from the outbox.
    edges:
    - a-api
- id: timeout
  name: The bank doesn't answer
  steps:
  - text: The state machine times out and marks the payment UNKNOWN. The app says it's being checked.
    edges:
    - sm-psp
    - sm-db
  - text: It never resends the debit. It asks for the status of the original transaction, backing off between tries.
    edges:
    - sm-psp
    - psp-npci
  - text: The switch eventually reports success or failure.
    edges:
    - psp-npci
  - text: If it's still unknown, the day's settlement file decides, and failed debits are reversed to the payer.
    edges:
    - psp-recon
    - recon-sm
requirements:
  features:
  - Pay a UPI ID, phone number or QR
  - Request money and approve requests
  - History and status of pending payments
  - Refunds and reversals
  - A notification for every debit and credit
  qualities:
  - Never debit twice, however often anything retries
  - Every payment ends in a known state
  - Append-only audit trail
  - Done within a few seconds
  - The PIN never touches the app's servers
numbers:
  assumption: 'Our assumption: our app handles about a tenth of all UPI payments.'
  rows:
  - what: Our payments
    size: about 1,000 a second
    how: A tenth of UPI's average, below. Peaks on salary days and festivals are several times higher.
  - what: Ledger storage
    size: about 30 TB a year
    how: 2.5 billion payments a month × about 1 KB of ledger entries and status changes.
  realScale:
  - name: UPI
    text: 'carried 25,466.70 million transactions in October 2026, worth ₹31.5 lakh crore, across 758 banks: about
      9,500 a second on average.'
    source:
      title: UPI product statistics
      publisher: National Payments Corporation of India
      year: '2026'
      url: https://www.npci.org.in/product/upi/product-statistics
      verified: true
decisions:
- title: A relational ledger
  text: 'Correct money beats raw scale: a strongly consistent database, sharded by payer.'
- title: An 'unknown' state
  text: After a timeout, retrying risks a double debit and assuming failure risks lost money. Ask for the status
    instead.
- title: Transactional outbox
  text: Writing the event in the same transaction means a crash never loses a notification or sends one for a rolled-back
    payment.
- title: Idempotency keys
  text: The client picks a key before the first try, and every retry carries it.
breaks:
- what: A partner bank slows down.
  fix: On festival days, circuit-break and route through another partner bank; show an honest 'pending'.
- what: A big sale at one merchant.
  fix: Their account becomes a hot row. Shard by payer and add up merchant credits asynchronously.
- what: A wave of collect-request scams.
  fix: Tighten risk rules for requests from new payees and add friction in the app.
companies:
- name: NPCI
  text: 'Runs the UPI switch between banks and publishes monthly volumes: 25,466.70 million transactions in October
    2026.'
  links:
