flows:
- id: join
  name: Join a call
  steps:
  - text: The app asks signalling to join the call.
    edges:
    - a-sig
  - text: Signalling adds it to the room and points it to a media server, usually the one already hosting the call.
    edges:
    - sig-rooms
    - rooms-sfu
  - text: The app and the server agree on codecs and how to reach each other.
    edges:
    - a-sig
  - text: Media starts flowing over UDP to the media server.
    edges:
    - a-sfu
- id: talk
  name: Talk
  steps:
  - text: Each sender sends its audio and video once, to the media server.
    edges:
    - a-sfu
  - text: The server forwards each stream to everyone else without decoding or mixing it.
    edges:
    - b-sfu
  - text: It forwards a lower quality to people on weak connections, and only active speakers in big calls.
    nodes:
    - sfu
  - text: If a network blocks UDP, traffic goes through a TURN relay instead.
    edges:
    - sfu-turn
requirements:
  features:
  - One-to-one and group calls
  - Audio, video and screen sharing
  - Join from a link
  - Recording
  qualities:
  - About 150 ms or less mouth to ear
  - Adapts to bad networks
  - Works behind strict firewalls
  - Calls of hundreds of people
numbers:
  assumption: 'Our assumption: 1 million people in calls at once, each sending 1.5 Mbps of video and receiving three
    streams.'
  rows:
  - what: Into media servers
    size: 1.5 Tbps
    how: 1 million senders × 1.5 Mbps.
  - what: Out of media servers
    size: about 4.5 Tbps
    how: Three forwarded streams per person. Forwarding, not mixing, keeps CPU cost low.
decisions:
- title: Through a server
  text: Peer-to-peer works for two people, but each sender would upload one copy per participant. A forwarding server
    needs one upload.
- title: Forward, don't mix
  text: An SFU forwards streams as they are, so it uses little CPU and adds little delay. Mixing happens on each
    device.
- title: UDP, with a fallback
  text: Late audio is useless, so lost packets are not resent. A TURN relay covers networks that block UDP.
breaks:
- what: One media server overloads.
  fix: Large calls are split across linked servers in different regions.
- what: Packet loss.
  fix: Error correction and lower quality layers keep audio going.
- what: Attacks on servers.
  fix: Routing all media through your servers hides users' IP addresses; spread capacity across providers.
companies:
- name: Discord
  text: Routes voice through its own servers rather than peer-to-peer, which gets too expensive as calls grow and
    would expose users' IP addresses. Each voice server has a signalling part and a selective forwarding unit. It
    ran more than 850 voice servers in 13 regions, serving over 2.6 million concurrent voice users with more than
    220 Gbps of egress.
  links:
  - title: How Discord handles two and half million concurrent voice users using WebRTC
    publisher: Discord
    year: '2018'
    url: https://discord.com/blog/how-discord-handles-two-and-half-million-concurrent-voice-users-using-webrtc
    verified: true
