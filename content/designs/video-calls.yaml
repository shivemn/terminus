id: video-calls
title: Design video calls
like:
- Zoom
- Google Meet
- Discord voice
level: core
summary: A signalling service tells everyone in a call which media server to use; the media itself flows over UDP
  to a selective forwarding unit (SFU), which forwards each person's stream to the others without mixing it. Senders
  can send several qualities so the server forwards what each receiver can take. The hard parts are latency, networks
  that block UDP, and calls with hundreds of people.
