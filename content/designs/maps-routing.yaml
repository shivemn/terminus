id: maps-routing
title: Design maps and routing
like:
- Google Maps
- Ola Maps
- Uber
level: advanced
summary: Roads are stored as a graph. A routing service finds a few good paths between two points, and a model predicts
  how long each will take from live traffic and the usual speeds for that hour. Phones on the road keep the live
  picture fresh, and the map itself is drawn from tiles served by a CDN. The hard parts are searching a graph of
  a whole country in milliseconds, and predicting traffic that hasn't happened yet.
