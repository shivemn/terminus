flows:
- id: route
  name: Get directions
  steps:
  - text: The app asks for a route from A to B.
    edges:
    - app-route
  - text: The routing service searches the road graph for a few good candidate paths.
    edges:
    - route-graph
  - text: The ETA model predicts each road's speed, from live traffic and the usual pattern for this time.
    edges:
    - route-eta
    - eta-live
    - eta-hist
  - text: The fastest path comes back, with alternatives and arrival times.
    edges:
    - app-route
- id: traffic
  name: Keep traffic fresh
  steps:
  - text: Phones that are navigating share their speed, anonymised.
    edges:
    - cars-live
  - text: Live traffic averages speeds on each road over the last few minutes.
    nodes:
    - live
  - text: These are saved to build the usual pattern for each road and hour.
    edges:
    - live-hist
- id: map
  name: Draw the map
  steps:
  - text: The app downloads square map tiles for the area on screen, mostly from a CDN.
    edges:
    - app-tiles
  - text: Route and traffic colours are drawn on top.
    edges:
    - app-route
requirements:
  features:
  - Directions by car, bike, foot and transit
  - Arrival time that accounts for traffic
  - Re-route when traffic changes
  - A map that pans and zooms smoothly
  qualities:
  - A route in well under a second
  - Arrival times usually right
  - Fresh within minutes
  - Works on slow phones and networks
numbers:
  assumption: 'Our assumption: 100 million route requests a day on a road graph of 500 million road segments.'
  rows:
  - what: Route requests
    size: about 1,200 a second
    how: 100 million ÷ 86,400, several times higher at rush hour.
  - what: Graph in memory
    size: tens of GB
    how: 500 million segments × about 50 bytes, split by region across servers.
  - what: Speed updates
    size: hundreds of thousands a second
    how: Millions of navigating phones each reporting every few seconds.
decisions:
- title: Precompute shortcuts
  text: A plain shortest-path search over a whole country is too slow. Precomputed shortcuts between major roads
    make it milliseconds.
- title: History plus live
  text: Live data says what is happening; history says what usually happens next. Predictions need both.
- title: Tiles from a CDN
  text: The map looks the same for everyone, so it is drawn once and cached everywhere.
breaks:
- what: A sudden crash.
  fix: History says the road is clear. Live speeds must override it within minutes.
- what: Patterns change.
  fix: After lockdowns or a new road, old history misleads. Weight recent weeks more.
- what: Everyone takes the same detour.
  fix: Sending all drivers one way jams it. Spread suggestions across alternatives.
companies:
- name: Google Maps
  text: Over 1 billion kilometres are driven with it each day. It combines historical traffic patterns with live
    conditions using machine learning; ETAs were accurate for over 97% of trips, and Graph Neural Networks built
    with DeepMind cut the inaccurate ones further. When the pandemic changed traffic, it began favouring patterns
    from the last two to four weeks. Routes also weigh road quality, road size and official data such as speed limits
    and closures.
  links:
  - title: 'Google Maps 101: how AI helps predict traffic and determine routes'
    publisher: Google
    year: '2020'
    url: https://blog.google/products/maps/google-maps-101-how-ai-helps-predict-traffic-and-determine-routes/
    verified: true
