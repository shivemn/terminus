flows:
- id: play
  name: Play a song
  steps:
  - text: The app asks for a track. The API returns its details and where the audio is.
    edges:
    - a-api
    - api-cat
  - text: The app fetches audio from the CDN at a quality that suits the connection, starting with the first chunk.
    edges:
    - a-cdn
  - text: The CDN fetches from storage only the first time anyone nearby plays it.
    edges:
    - cdn-audio
  - text: The app buffers the next track before this one ends, so playback is gapless.
    nodes:
    - app
  - text: It sends a play event.
    edges:
    - a-events
- id: search
  name: Search
  steps:
  - text: The app sends what the person typed.
    edges:
    - a-api
  - text: The search service matches tracks, artists and albums, ranked by popularity.
    edges:
    - api-search
- id: royalties
  name: Count plays
  steps:
  - text: Play events from every app arrive at event delivery.
    edges:
    - a-events
  - text: They are written out in hourly batches.
    edges:
    - ev-jobs
  - text: Batch jobs turn them into royalty reports, charts and recommendation data.
    nodes:
    - jobs
requirements:
  features:
  - Search and play any track
  - Playlists and libraries
  - Offline downloads
  - Quality that adapts to the connection
  qualities:
  - Starts almost instantly
  - Gapless between tracks
  - Every play counted once
  - Works on poor networks
numbers:
  assumption: 'Our assumption: 50 million listeners a day, 2 hours each, at 160 kbps.'
  rows:
  - what: Listening
    size: 100 million hours a day
    how: 50 million × 2 hours.
  - what: Average bandwidth
    size: about 670 Gbps
    how: 100 million hours × 160 kbps ÷ 86,400 seconds. Evenings are several times higher.
  - what: Play events
    size: about 17,000 a second
    how: 'About 30 tracks each a day: 1.5 billion ÷ 86,400.'
decisions:
- title: Audio from a CDN
  text: Songs are small and popular ones are played constantly, so caches near listeners do almost all the work.
- title: Several qualities
  text: Low quality on mobile data, high on Wi-Fi, chosen by the app.
- title: Plays as events
  text: Royalties depend on plays, so events are delivered reliably and counted in batch rather than updated live.
breaks:
- what: A big album drops.
  fix: Millions play the same tracks at midnight. Push them to CDN caches in advance.
- what: Event delivery falls behind.
  fix: Apps keep events and resend them; batch jobs wait for a complete hour before counting.
- what: Offline listening.
  fix: Plays happen without a connection. The app stores events and sends them later.
companies:
- name: Spotify
  text: 'Offers qualities from about 24 kbps (Low) to 320 kbps (Very high), plus lossless FLAC up to 24-bit/44.1
    kHz; the web player uses AAC at 128 or 256 kbps. Every action in the app, such as playing a song, is sent as
    an event: by 2016 its event delivery moved more than 700,000 events a second, written out as hourly batches.'
