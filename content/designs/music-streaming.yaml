id: music-streaming
title: Design music streaming
like:
- Spotify
- JioSaavn
- YouTube Music
level: starter
summary: The catalogue and search answer what to play; the audio itself comes from a CDN, encoded at several qualities
  so the app can pick one that suits the connection. Every play is sent back as an event, because plays decide royalties,
  charts and recommendations. The hard parts are instant start and gapless playback, offline downloads, and counting
  every play exactly once.
