id: collab-editing
title: Design collaborative editing
like:
- Google Docs
- Figma
- Notion
level: advanced
summary: Everyone editing a document keeps an open connection to the one server process that owns it. Each change
  is sent with the version it was made on; the server puts changes in a single order, adjusts any made on an older
  version so they still apply correctly, saves them to a log and sends them to everyone else. The hard parts are
  edits that cross in flight, cursors and presence, and opening long documents fast.
stops:
- distributed-systems
- concurrency
- networking
- database-internals
- redis
- web-http
