flows:
- id: type
  name: Type a word
  steps:
  - text: Your editor applies the change at once, then sends it with the version it was made on.
    edges:
    - you-r
  - text: The router sends it to the one process that owns this document.
    edges:
    - r-doc
  - text: If other changes arrived first, the process adjusts yours so it still lands in the right place.
    nodes:
    - doc
  - text: It appends the change to the log, giving it the next version number.
    edges:
    - doc-log
  - text: It sends the change to everyone else, who apply it the same way.
    edges:
    - r-doc
    - mate-r
- id: clash
  name: Two edits at once
  steps:
  - text: You and a teammate change the same thing at the same moment.
    edges:
    - you-r
    - mate-r
  - text: Both changes reach the document process; it alone decides their order.
    edges:
    - r-doc
  - text: For text, the second change is shifted past the first so both survive. For a single setting, such as a
      colour, the last one to arrive wins.
    nodes:
    - doc
  - text: Everyone receives the changes in that one order, so every copy ends up the same.
    edges:
    - mate-r
    - you-r
- id: open
  name: Open a document
  steps:
  - text: The router starts a process for the document if none is running.
    edges:
    - you-r
    - r-doc
  - text: The process loads the latest snapshot, then the few changes made after it.
    edges:
    - log-snap
    - doc-log
  - text: It sends the document and who else is here.
    edges:
    - doc-pres
    - r-doc
requirements:
  features:
  - Many people edit one document at once
  - See others' cursors and selections
  - Full version history
  - Keep working offline and catch up
  qualities:
  - Your own typing never waits on the network
  - Everyone ends up with the same document
  - No edit is lost
  - Long documents open quickly
numbers:
  assumption: 'Our assumption: 10 million documents open at once, with 1 million people typing at any moment.'
  rows:
  - what: Changes in
    size: about 2 million a second
    how: 1 million typists × 2 changes a second, after batching keystrokes.
  - what: Changes out
    size: several million a second
    how: Each change goes to everyone else in the document, usually a handful of people.
  - what: Log growth
    size: tens of GB an hour
    how: Each change is small, about 100 bytes, but there are billions an hour. Snapshots keep opening fast.
decisions:
- title: One owner per document
  text: A single process orders every change, which makes conflicts far simpler than letting servers agree among
    themselves.
- title: Apply locally first
  text: Typing shows instantly; the server confirms or adjusts later.
- title: Store changes, not files
  text: A log of small changes gives version history for free and makes syncing cheap.
breaks:
- what: A document with hundreds of editors.
  fix: One process becomes the bottleneck. Batch changes and send cursors less often.
- what: The process crashes.
  fix: Start a new one from the snapshot and log; clients resend changes not yet confirmed.
- what: Someone edits offline for days.
  fix: Their changes are far behind. Adjust them in one batch, or fall back to saving a copy.
companies:
- name: Google Docs
  text: 'Saves each document as a revision log of three kinds of change: inserting text, deleting text and applying
    styles. When edits cross, operational transformation (OT) adjusts them so that once everyone has every change,
    all copies match.'
  links:
  - title: 'What''s different about the new Google Docs: conflict resolution'
    publisher: Google Drive Blog
    year: '2010'
    url: https://drive.googleblog.com/2010/09/whats-different-about-new-google-docs_22.html
    verified: true
- name: Figma
  text: Chose not to use OT. Clients talk to servers over WebSockets, and the servers run a separate process for
    each document. Because the server is the central authority, two changes to the same property simply end with
    the last value the server received.
  links:
  - title: How Figma's multiplayer technology works
    publisher: Figma
    year: '2019'
    url: https://www.figma.com/blog/how-figmas-multiplayer-technology-works/
    verified: true
