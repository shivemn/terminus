flows:
- id: under
  name: A request under the limit
  steps:
  - text: A client calls POST /v1/charges with its API key.
    edges:
    - c-gw
  - text: The gateway checks its local block list. This client isn't on it.
    edges:
    - gw-local
  - text: It finds the rule in memory, say 100 requests a second for this plan.
    nodes:
    - gw
  - text: It adds one to the client's counter for this window and reads back the counts, in one atomic step.
    edges:
    - gw-c
  - text: 'Under the limit: the request goes through with rate-limit headers added.'
    edges:
    - gw-api
    - c-gw
- id: over
  name: A request over the limit
  steps:
  - text: The count comes back over the limit.
    edges:
    - gw-c
  - text: The gateway adds the client to its local block list until the window resets, so its next requests skip
      Redis.
    edges:
    - gw-local
  - text: The client gets 429 with Retry-After and backs off.
    edges:
    - c-gw
  - text: Counts of 429s feed dashboards and alerts.
    edges:
    - c-alerts
- id: down
  name: Redis goes down
  steps:
  - text: The gateway can't reach the counter store.
    edges:
    - gw-c
  - text: 'It fails open: requests go through unchecked rather than the API going down with the limiter.'
    edges:
    - gw-api
  - text: Local block lists still stop clients that were already blocked.
    edges:
    - gw-local
requirements:
  features:
  - Limit each key, user or IP per window, per rule
  - Different limits per endpoint and plan
  - 429 with a Retry-After header
  - Rules change without a redeploy
  qualities:
  - Adds a millisecond or two at most
  - Holds across many servers
  - Fails open if the limiter breaks
  - Never blocks honest clients below their limit
numbers:
  assumption: 'Our assumption: an API serving 50,000 requests a second across 100 servers, with 10 million clients
    a day.'
  rows:
  - what: Counter operations
    size: 50,000–100,000 a second
    how: One or two per request.
  - what: Counter memory
    size: about 500 MB
    how: 'A sliding-window counter keeps two numbers per client per rule: about 50 bytes × 10 million.'
  - what: Redis shards
    size: a few
    how: Memory fits on one node; shard by client for throughput and to avoid one point of failure.
decisions:
- title: Sliding-window counter
  text: Near-exact with two numbers per client. A token bucket suits APIs that should allow short bursts.
- title: Shared counters
  text: Counts in each server's memory would let a client get the limit once per server. A shared Redis costs one
    round trip.
- title: Remember blocks locally
  text: Once a client is over the limit, every gateway caches that until the window resets, so attacks don't load
    Redis.
- title: Fail open
  text: An outage of the limiter shouldn't become an outage of the API.
breaks:
- what: One huge client.
  fix: Its key lands on one Redis shard. Give it a local pre-check or split its key across shards.
- what: Users in many regions.
  fix: Count per region instead of globally, accepting that a client could get its limit in each.
- what: An attack from millions of IPs.
  fix: Per-client limits don't help. You need load shedding, bot detection and limits at the network edge.
companies:
- name: Stripe
  text: 'Runs four limiters: a request rate limiter (the most important), a concurrent-requests limiter, and two
    load shedders that keep capacity for critical requests such as creating charges. They are token buckets in Redis,
    wired in so a Redis outage never affects requests.'
  links:
  - title: Scaling your API with rate limiters
    publisher: Stripe
    year: '2017'
    url: https://stripe.com/blog/rate-limiters
    verified: true
- name: Cloudflare
  text: Counts per data centre, in memcached sharded by consistent hashing, with the sliding-window counter. Across
    400 million requests, 0.003% were wrongly allowed or limited. Once a client is over, every server caches the
    block.
  links:
  - title: How we built rate limiting capable of scaling to millions of domains
    publisher: Cloudflare
    year: '2017'
    url: https://blog.cloudflare.com/counting-things-a-lot-of-different-things/
    verified: true
