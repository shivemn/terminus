id: rate-limiter
title: Design a rate limiter
like:
- Stripe
- Cloudflare
- GitHub
level: starter
summary: 'Every request passes a check at the gateway: find the rule for this client, add one to its counter for
  the current window, and compare. Counters live in a shared, sharded Redis so the limit holds across servers. Clients
  already over the limit are remembered locally, so blocking costs nothing. The hard parts are the counting algorithm,
  where the counts live, and what happens when the limiter itself fails.'
