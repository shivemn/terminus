flows:
- id: send
  name: Send a message
  steps:
  - text: Your phone sends the message, with an ID it made, over its open connection.
    edges:
    - a-lb
    - lb-gw
  - text: The gateway passes it to the message service.
    edges:
    - gw-msg
  - text: The service checks you are in this chat.
    edges:
    - msg-groups
  - text: It gives the message a server ID that sorts by time and writes it to the store. If the phone retried,
      the same ID means it is stored once.
    edges:
    - msg-store
  - text: 'It replies to your phone: one tick.'
    edges:
    - gw-msg
    - lb-gw
    - a-lb
  - text: It looks up which gateway holds the recipient.
    edges:
    - msg-sess
  - text: It sends the message to that gateway.
    edges:
    - msg-gw
  - text: The gateway pushes it down the recipient's open connection.
    edges:
    - gw-b
  - text: The recipient's phone confirms. You see two ticks.
    edges:
    - gw-b
    - msg-gw
    - gw-msg
    - a-lb
- id: offline
  name: Recipient is offline
  steps:
  - text: You send as usual. The message is checked and stored.
    edges:
    - a-lb
    - lb-gw
    - gw-msg
    - msg-store
  - text: The session lookup finds no open connection for the recipient.
    edges:
    - msg-sess
  - text: The message service asks the push service to wake their phone.
    edges:
    - msg-push
  - text: 'A notification goes out through Apple or Google. Apple and Google can''t read it: it carries no message
      text, or only encrypted text.'
    edges:
    - push-apns
    - apns-b
  - text: Their app opens, connects to a gateway and registers.
    edges:
    - gw-b
    - gw-sess
  - text: It asks for everything after the last message ID it has. The service reads those from the store.
    edges:
    - gw-msg
    - msg-store
    - msg-gw
    - gw-b
  - text: Once their phone confirms, WhatsApp deletes the message from its servers. Discord and Slack keep it.
    edges:
    - msg-store
- id: photo
  name: Send a photo
  steps:
  - text: Your phone encrypts the photo with a fresh key.
    nodes:
    - phone-a
  - text: It uploads the encrypted file to the media service.
    edges:
    - a-media
  - text: The media service saves it to object storage and returns a link.
    edges:
    - media-obj
  - text: Your phone sends an ordinary message holding the link and the key.
    edges:
    - a-lb
    - lb-gw
    - gw-msg
    - msg-store
  - text: The recipient gets that message the usual way.
    edges:
    - msg-gw
    - gw-b
  - text: Their phone downloads the file from the CDN, which fetches it from storage the first time.
    edges:
    - b-cdn
    - cdn-obj
  - text: It decrypts the photo with the key from the message. The servers never saw it.
    nodes:
    - phone-b
- id: group
  name: Message a group
  steps:
  - text: You send one message to the group.
    edges:
    - a-lb
    - lb-gw
    - gw-msg
  - text: The service fetches the member list, usually from a cache.
    edges:
    - msg-groups
  - text: The message is stored once, not once per member.
    edges:
    - msg-store
  - text: For each member it looks up their gateway, and sends one copy per gateway rather than one per member.
    edges:
    - msg-sess
    - msg-gw
  - text: Each gateway delivers to its members who are online.
    edges:
    - gw-b
  - text: Members who are offline get a push notification.
    edges:
    - msg-push
    - push-apns
    - apns-b
  - text: With end-to-end encryption the server only ever passes on ciphertext. The keys live on the phones.
    nodes:
    - phone-a
    - phone-b
requirements:
  features:
  - One-to-one and group chats
  - Sent, delivered and read ticks
  - Photos and files
  - Online and last seen
  - Messages wait for offline phones
  qualities:
  - Delivered in well under a second
  - Never lost, never shown twice
  - In order within a chat
  - Light on battery and mobile data
  - Keeps working when a server dies
numbers:
  assumption: 'Our assumption for a mid-size app: 100 million people a day, 40 messages each. These are not WhatsApp''s
    figures.'
  rows:
  - what: Messages
    size: 46,000 a second
    how: 4 billion a day ÷ 86,400 seconds. Plan for about three times that at peak.
  - what: Text stored
    size: 800 GB a day
    how: About 200 bytes per message with its details. Only if you keep history, which WhatsApp does not.
  - what: Open connections
    size: 30 million
    how: Say 30% of daily users are online at the busiest moment.
  - what: Gateway servers
    size: 60 to 300
    how: 100,000 to 500,000 connections each, leaving room for a server to fail.
  realScale:
  - name: WhatsApp
    text: was delivering roughly 100 billion messages a day in 2020, about 25 times our example, and deletes each
      one from its servers once it is delivered.
    source:
      title: WhatsApp is now delivering roughly 100 billion messages a day
      publisher: TechCrunch
      year: '2020'
      url: https://techcrunch.com/2020/10/29/whatsapp-is-now-delivering-roughly-100-billion-messages-a-day/
      verified: true
  - name: Discord
    text: keeps every message forever. By 2023 that was trillions of messages on 72 database nodes.
    source:
      title: How Discord stores trillions of messages
      publisher: Discord
      year: '2023'
      url: https://discord.com/blog/how-discord-stores-trillions-of-messages
      verified: true
decisions:
- title: Open connection, not polling
  text: A WebSocket or long-lived TCP connection lets the server push at once. Asking "anything new?" every few
    seconds is slow and drains the battery.
- title: Server-made IDs
  text: Phone clocks are wrong. IDs that sort by time (timestamp, machine, sequence, as in Twitter's Snowflake)
    give one order everyone agrees on.
- title: Store by chat
  text: The common read is "latest messages in this chat", so a wide-column store partitioned by chat and time window
    beats one big SQL table.
- title: Keep or delete
  text: Deleting after delivery (WhatsApp) or keeping forever (Discord, Slack) is a product choice. It changes storage
    by orders of magnitude.
- title: End-to-end encryption
  text: The server can't read messages, so search and backups move to the phone.
- title: Big groups pull
  text: Push each message to small groups. In huge channels, members fetch recent messages when they open the chat.
breaks:
- what: A gateway restarts.
  fix: Hundreds of thousands of phones reconnect at once. Phones wait a random, growing delay before retrying.
- what: One chat gets huge.
  fix: Its partition is overloaded. Split by time window and merge identical reads, as Discord does.
- what: New Year's Eve.
  fix: Push notifications spike. Collapse several messages into one notification and queue the rest.
companies:
- name: WhatsApp
  text: In 2012 a single Erlang server held over 2 million open connections. Messages are end-to-end encrypted and
    leave the server once delivered. Each linked device has its own keys, so a sender's phone encrypts a copy for
    every device.
  links:
  - title: 1 million is so 2011
    publisher: WhatsApp blog
    year: '2012'
    url: https://blog.whatsapp.com/1-million-is-so-2011
    verified: true
  - title: How WhatsApp enables multi-device capability
    publisher: Meta Engineering
    year: '2021'
    url: https://engineering.fb.com/2021/07/14/security/whatsapp-multi-device/
    verified: true
  - title: 'Privacy policy: messages deleted once delivered'
    publisher: WhatsApp
    year: '2026'
    url: https://www.whatsapp.com/legal/privacy-policy
    verified: true
- name: Discord
  text: Keeps every message. Moved from MongoDB to Cassandra, then to ScyllaDB. Its real-time chat runs on Elixir,
    on the Erlang VM, with a library it built (Manifold) to batch messages between servers.
  links:
  - title: How Discord stores billions of messages
    publisher: Discord
    year: '2017'
    url: https://discord.com/blog/how-discord-stores-billions-of-messages
    verified: true
  - title: How Discord stores trillions of messages
    publisher: Discord
    year: '2023'
    url: https://discord.com/blog/how-discord-stores-trillions-of-messages
    verified: true
  - title: How Discord scaled Elixir to 5,000,000 concurrent users
    publisher: Discord
    year: '2017'
    url: https://discord.com/blog/how-discord-scaled-elixir-to-5-000-000-concurrent-users
    verified: true
- name: Slack
  text: Channel servers keep recent channel state in memory and are found by consistent hashing. Gateway servers
    in each region hold the WebSockets.
  links:
  - title: Real-time messaging
    publisher: Slack Engineering
    year: '2023'
    url: https://slack.engineering/real-time-messaging/
    verified: true
- name: Messenger
  text: Moved phones from asking for updates to being pushed an ordered stream of changes (a service called Iris),
    which cut non-media data use by 40%.
  links:
  - title: Building mobile-first infrastructure for Messenger
    publisher: Facebook Engineering
    year: '2014'
    url: https://engineering.fb.com/2014/10/09/production-engineering/building-mobile-first-infrastructure-for-messenger/
    verified: true
- name: Telegram
  text: Publishes its protocol, MTProto, rather than its server design. Ordinary chats are stored on its servers
    so every device syncs. Only Secret Chats are end-to-end encrypted.
  links:
  - title: MTProto protocol
    publisher: Telegram
    year: '2026'
    url: https://core.telegram.org/mtproto
    verified: true
  - title: 'FAQ: secret chats'
    publisher: Telegram
    year: '2026'
    url: https://telegram.org/faq#secret-chats
    verified: true
