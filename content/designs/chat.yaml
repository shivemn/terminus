id: chat
title: Design a chat app
like:
- WhatsApp
- Telegram
- Discord
- Slack
level: core
summary: Every phone keeps one connection open to a gateway, so the server can push a message the moment it arrives.
  A message service checks it, gives it an ID that sorts by time, stores it and sends it to whichever gateway holds
  the recipient. If the recipient is offline, a push notification wakes their phone. The hard parts are never losing
  a message, never showing it twice, and keeping order.
stops:
- api-styles
- scaling-load-balancing
- messaging
- redis
- partitioning-replication
- caching
- reliability-patterns
- cryptography
