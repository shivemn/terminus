id: stock-exchange
title: Design a stock exchange
like:
- NSE
- Nasdaq
- LMAX
level: advanced
summary: Orders pass risk checks at a gateway, then a sequencer gives each one a number and writes it to a journal
  before anything happens. A single-threaded matching engine applies them in that exact order to an in-memory order
  book, pairing buyers and sellers by price, then time. Because the inputs are journalled in order, a standby can
  replay them and reach the same state. The hard parts are microsecond latency, fairness, and never losing a trade.
