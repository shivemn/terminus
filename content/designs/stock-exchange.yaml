flows:
- id: order
  name: Place an order
  steps:
  - text: A broker sends an order to buy 100 shares at ₹500.
    edges:
    - b-g
  - text: The gateway checks it and the broker's risk limits.
    edges:
    - g-s
  - text: The sequencer gives it the next number and writes it to the journal before anything else.
    edges:
    - s-j
  - text: The matching engine takes orders strictly in that order.
    edges:
    - s-e
- id: match
  name: Match
  steps:
  - text: The engine looks at the best sell price in the book. If it's ₹500 or lower, a trade happens; the oldest
      order at that price goes first.
    nodes:
    - engine
  - text: Anything left over rests in the book.
    nodes:
    - engine
  - text: Trades are recorded for settlement and published on the market data feed; brokers get confirmations.
    edges:
    - e-t
    - e-md
    - s-e
    - g-s
    - b-g
- id: fail
  name: The engine fails
  steps:
  - text: The standby has been receiving every journalled input in the same order.
    edges:
    - j-sb
  - text: Replaying the same inputs in the same order gives exactly the same book, so it takes over without losing
      an order.
    nodes:
    - standby
requirements:
  features:
  - Limit and market orders
  - Price, then time priority
  - Live market data
  - Cancel and modify orders
  qualities:
  - Microseconds per order
  - Strictly fair ordering
  - No order or trade ever lost
  - Recovers in seconds
numbers:
  assumption: 'Our assumption: 100,000 orders a second at peak across 5,000 listed stocks.'
  rows:
  - what: Time per order
    size: under 10 µs
    how: 1 second ÷ 100,000 leaves 10 µs each on one thread, with headroom needed.
  - what: Journal
    size: about 10 MB a second
    how: 100,000 orders × about 100 bytes.
  - what: Order book
    size: fits in memory
    how: '5,000 books × thousands of resting orders: a few GB at most.'
decisions:
- title: One thread
  text: Matching on a single thread needs no locks and gives one clear order of events.
- title: Journal before acting
  text: Writing every input first means the state can always be rebuilt by replaying.
- title: Everything in memory
  text: Disk and database round trips are far too slow at microsecond scale.
breaks:
- what: A flood of orders.
  fix: Throttle at the gateway per broker, before the sequencer.
- what: One very busy stock.
  fix: Run separate engines for groups of stocks, each single-threaded.
- what: Unfair network paths.
  fix: Some brokers are closer. Equal cable lengths and timestamps at the edge keep it fair.
companies:
- name: LMAX
  text: Built the Disruptor while building what it calls the world's highest performance financial exchange, after
    finding that queues between pipeline stages dominated its costs. At its heart is a ring buffer allocated once
    at start-up; in LMAX's tests a three-stage pipeline had mean latency three orders of magnitude lower than with
    queues, and about 8 times the throughput.
  links:
  - title: 'LMAX Disruptor: high performance alternative to bounded queues'
    publisher: LMAX
    year: '2011'
    url: https://lmax-exchange.github.io/disruptor/disruptor.html
    verified: true
others:
- title: The LMAX architecture
  publisher: Martin Fowler
  url: https://martinfowler.com/articles/lmax.html
