id: recommendations
title: Design a recommendation system
like:
- YouTube
- Netflix
- Flipkart
level: advanced
summary: 'Recommending from millions of items happens in two steps: candidate generation quickly picks a few hundred
  that might fit, then a ranking model scores each one carefully. Models are trained offline on what people watched
  or skipped, while recent activity is updated nearline so the home screen reacts within minutes. The hard parts
  are the size of the catalogue, freshness, and learning from what people actually did.'
