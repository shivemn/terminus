flows:
- id: home
  name: Open the home screen
  steps:
  - text: The app asks for recommendations.
    edges:
    - u-api
  - text: Candidate generation uses the person's recent history to pick a few hundred items from millions.
    edges:
    - api-cand
    - recent-cand
  - text: It finds items close to their taste in an embedding index.
    edges:
    - cand-index
  - text: A larger ranking model scores each candidate.
    edges:
    - cand-rank
  - text: The ranked list comes back and the page is built.
    edges:
    - rank-api
    - u-api
- id: learn
  name: Learn from what they did
  steps:
  - text: Every watch, click and skip is logged as an event.
    edges:
    - u-events
  - text: Recent activity is updated within minutes, so the next visit reacts.
    edges:
    - ev-recent
  - text: Offline training retrains the models and item embeddings on the full history.
    edges:
    - ev-train
  - text: New models and embeddings are pushed out.
    edges:
    - train-rank
    - train-index
requirements:
  features:
  - A personal home screen
  - '"Because you watched" rows'
  - New items get a chance
  - React to what you just did
  qualities:
  - Page built in about 200 ms
  - Fresh within minutes
  - Learns from real behaviour
  - Cheap enough to run for everyone
numbers:
  assumption: 'Our assumption: 100 million home-screen loads a day and a catalogue of 10 million items.'
  rows:
  - what: Page loads
    size: about 1,200 a second
    how: 100 million ÷ 86,400, much higher in the evening.
  - what: Items scored
    size: about 500 per load
    how: Ranking all 10 million would be 20,000 times the work.
  - what: Events
    size: tens of thousands a second
    how: Every view, click and skip from every session.
decisions:
- title: Two stages
  text: A cheap model narrows millions to hundreds; an expensive one ranks only those.
- title: Offline, nearline, online
  text: Heavy training runs offline, recent activity updates nearline, and only the final scoring runs while you
    wait.
- title: Learn from behaviour
  text: What people watch to the end says more than what they click.
breaks:
- what: A brand-new item.
  fix: No one has watched it, so nothing recommends it. Mix in some new items on purpose.
- what: A brand-new user.
  fix: No history. Start with popular items and learn fast.
- what: Feedback loops.
  fix: People can only watch what is shown, so the model learns its own habits. Explore a little.
companies:
- name: YouTube
  text: 'Splits recommendation into the classic two stages: a deep candidate generation model, then a separate deep
    ranking model, described in a 2016 paper on what it calls one of the largest industrial recommendation systems.'
  links:
  - title: Deep neural networks for YouTube recommendations
    publisher: Google Research
    year: '2016'
    url: https://research.google/pubs/deep-neural-networks-for-youtube-recommendations/
    verified: true
- name: Netflix
  text: Splits computation into offline, nearline and online. Online responds to recent events but must answer in
    real time, which limits how much it can compute; offline has fewer limits on data and complexity.
  links:
  - title: System architectures for personalization and recommendation
    publisher: Netflix Technology Blog
    year: '2013'
    url: https://netflixtechblog.com/system-architectures-for-personalization-and-recommendation-e081aa94b5d8
    verified: true
