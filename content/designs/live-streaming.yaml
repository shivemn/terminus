flows:
- id: bat
  name: From bat to phone
  steps:
  - text: The broadcast is encoded at the ground and sent to the cloud, usually over two independent paths.
    edges:
    - s-t
  - text: The transcoder re-encodes it at several bitrates and resolutions.
    edges:
    - t-p
  - text: The packager cuts each quality into segments of a few seconds and updates the playlists.
    edges:
    - p-o
  - text: The CDN mid-tier fetches each new segment once from the origin.
    edges:
    - o-sh
  - text: Edge servers fetch it once more and serve everyone nearby.
    edges:
    - sh-edge
  - text: Each player downloads segments, measures its throughput and switches quality to avoid buffering.
    edges:
    - edge-pl
- id: play
  name: Press play at the toss
  steps:
  - text: The player calls the playback API.
    edges:
    - pl-api
  - text: The API checks the subscription from cache and returns a signed playlist URL.
    edges:
    - api-ent
    - pl-api
  - text: The CDN edge returns the playlist and first segments from cache.
    edges:
    - edge-pl
  - text: The player starts at a low quality for a fast start, then climbs.
    nodes:
    - player
- id: panic
  name: A traffic spike
  steps:
  - text: A wicket falls and millions open the app within a minute.
    edges:
    - pl-api
    - edge-pl
  - text: Servers were already scaled up before the match from forecasts, because new ones take too long to start.
    nodes:
    - api
  - text: If load keeps climbing, panic mode turns off recommendations and personalisation.
    edges:
    - pl-extras
  - text: 'The video keeps playing: it comes from CDN caches, not from the services.'
    edges:
    - sh-edge
    - edge-pl
requirements:
  features:
  - Watch live on phones, TVs and browsers
  - Quality adjusts to each viewer's connection
  - Subscription checked before playing
  - Live score, commentary languages and ads
  - Pause, rewind and rejoin live
  qualities:
  - Starts within a couple of seconds
  - Seconds behind the TV broadcast, not minutes
  - Survives tens of millions joining in minutes
  - When something fails, the video keeps playing
numbers:
  assumption: 'Our assumption: 25 million people watching at once, at 400 kbps each on average.'
  rows:
  - what: Bandwidth
    size: about 10 Tbps
    how: 25 million × 400 kbps.
  - what: Segment requests
    size: about 6 million a second
    how: 25 million viewers ÷ one 4-second segment each.
  - what: Joining
    size: over a million a minute
    how: Everyone arrives at the toss or after a wicket, faster than new servers start.
decisions:
- title: HTTP segments
  text: HLS and DASH put viewers seconds behind live, but segments cache on CDNs and scale to tens of millions.
    Real-time protocols don't scale that cheaply.
- title: Scale before the match
  text: Traffic rises faster than new servers can start, so capacity is added from forecasts and tested with load
    and failure drills.
- title: Drop the extras
  text: Viewers forgive a missing recommendation row, not a frozen match.
breaks:
- what: A push notification.
  fix: It sends tens of millions to the app in seconds. Send in waves and pre-warm what they hit.
- what: One CDN runs out of capacity.
  fix: Use several CDNs, steer by live performance, and lower the default quality.
- what: The subscription database.
  fix: Cache entitlements for the whole match and let people who were already watching keep watching.
companies:
- name: Hotstar (now JioHotstar)
  text: Set a record of 25.3 million concurrent viewers on 10 July 2019, India vs New Zealand. At that scale it
    reported over a million requests a second and over 10 Tbps. It pre-warmed servers instead of relying on autoscaling,
    ran load and chaos drills before big games, and had a panic mode that switched off personalisation.
  links:
  - title: Hotstar sets new global record for live viewership
    publisher: AWS for Media & Entertainment
    year: '2019'
    url: https://aws.amazon.com/blogs/media/in-the-news-hotstar-sets-new-global-record-for-live-viewership/
    verified: true
  - title: Report on Hotstar's AWS re:Invent talk (CMY302)
    publisher: DevelopersIO (Classmethod)
    year: '2019'
    url: https://dev.classmethod.jp/articles/reinvent-2019-cmy302/
    verified: true
- name: Netflix
  text: Its Open Connect programme places Netflix cache appliances inside internet providers' networks, so video
    travels a short way to viewers.
  links:
  - title: Netflix Open Connect
    publisher: Netflix
    year: '2026'
    url: https://openconnect.netflix.com/en/
    verified: true
