id: live-streaming
title: Design live sports streaming
like:
- JioHotstar
- YouTube Live
- Netflix live events
level: advanced
summary: 'The match is encoded at several qualities, cut into segments a few seconds long, and pushed to an origin.
  CDN servers, many inside internet providers, fetch each segment once and serve it to everyone nearby, while each
  player picks the quality its connection can take. The video scales on the CDN. What breaks is everything around
  it: millions of people pressing play in the same minute at the toss.'
