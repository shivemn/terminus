flows:
- id: assign
  name: An order gets a partner
  steps:
  - text: The customer places the order and sees an estimated time.
    edges:
    - c-o
    - o-eta
  - text: The restaurant accepts and says when food will be ready.
    edges:
    - r-o
  - text: Every few seconds the city's dispatcher collects unassigned orders.
    edges:
    - o-disp
  - text: The geo index returns nearby available partners for each order.
    edges:
    - disp-geo
  - text: The ETA service predicts travel to the restaurant, food-ready time and delivery time for each pairing.
    edges:
    - disp-eta
  - text: The dispatcher scores every pairing and solves for the best overall assignment, combining orders where
      routes line up.
    nodes:
    - disp
  - text: Offers go out. A decline puts the order back into the next batch.
    edges:
    - disp-offer
    - offer-p
- id: gps
  name: A location update
  steps:
  - text: The partner app sends a batch of GPS fixes.
    edges:
    - p-loc
  - text: The gateway drops impossible jumps and publishes the rest to the city's stream.
    edges:
    - loc-stream
  - text: The geo index updates the partner's latest position and cell.
    edges:
    - stream-geo
  - text: If this partner is carrying an order, the customer's map moves.
    nodes:
    - cust
requirements:
  features:
  - Order, and track the delivery live
  - Each order assigned to a partner who can accept or decline
  - Delivery-time estimates before and during
  - Partners carry more than one order when routes line up
  qualities:
  - Assignment within seconds
  - Locations from every partner every few seconds
  - A failure in one city doesn't touch others
  - Short waits at restaurants and fair earnings
numbers:
  assumption: 'Our assumption: 3 million orders a day and 300,000 partners online at the peak.'
  rows:
  - what: Orders
    size: about 100 a second at peak
    how: 35 a second on average; lunch and dinner about three times that.
  - what: Location updates
    size: 60,000 a second
    how: 300,000 partners, one fix every 5 seconds each.
  - what: Live location data
    size: about 30 MB
    how: 'Only the latest position matters for dispatch: 300,000 × 100 bytes, in memory.'
decisions:
- title: Batch, then solve
  text: Matching all of a city's orders together every few seconds beats assigning one order at a time.
- title: Split by city
  text: Orders and partners rarely cross cities, so load and failures stay local.
- title: Latest position in memory
  text: Dispatch needs speed. The full history goes to the stream for analytics.
breaks:
- what: Rain.
  fix: Orders double and partners halve. Raise incentives, quote longer times, and slow new orders before the dispatcher
    drowns.
- what: The solver runs long.
  fix: Time-box it and use the best answer so far, or split the city into zones.
- what: GPS errors.
  fix: Partners teleport. Filter impossible speeds and fall back to the last good fix.
companies:
- name: Uber
  text: 'Built H3, a hexagonal grid, for pricing and dispatch: for example, it measures supply and demand per hexagon
    to set surge pricing. Hexagons reduce error when moving people are bucketed into cells. It open-sourced H3 in
    2018.'
  links:
  - title: 'H3: Uber''s hexagonal hierarchical spatial index'
    publisher: Uber Engineering
    year: '2018'
    url: https://www.uber.com/blog/h3/
    verified: true
- name: DoorDash
  text: First solved dispatch as bipartite matching with the Hungarian algorithm, which was too slow and couldn't
    combine deliveries. It moved to a mixed-integer program solved with Gurobi, run several times a minute on instances
    split by region, and checked the new optimiser by running it alongside the old one.
  links:
  - title: Next-generation optimization for Dasher dispatch at DoorDash
    publisher: DoorDash Engineering
    year: '2020'
    url: https://doordash.engineering/2020/02/28/next-generation-optimization-for-dasher-dispatch-at-doordash/
    verified: true
