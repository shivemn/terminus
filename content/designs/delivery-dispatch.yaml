id: delivery-dispatch
title: Design food delivery dispatch
like:
- Swiggy
- Zomato
- Uber Eats
- DoorDash
level: advanced
summary: Every partner's phone streams its location every few seconds into a geo index that keeps only the latest
  position. Every few seconds, a dispatcher for each city takes all unassigned orders, asks for nearby partners
  and predicted times, and solves for the best overall set of assignments, including combining orders. Offers go
  out, and a decline puts the order back in the next batch. Half of it is a streaming system and half an optimisation
  problem.
stops:
- messaging
- redis
- partitioning-replication
- operations-research
- machine-learning
- reliability-patterns
