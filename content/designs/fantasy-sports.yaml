id: fantasy-sports
title: Design a fantasy sports app
like:
- Dream11
- Fantasy Premier League
- ESPN Fantasy
level: advanced
summary: People pick teams and join contests, mostly in the minutes before a match starts. During the match, a live
  feed of events turns into points for each player, each team's score is the sum of its players, and leaderboards
  are re-sorted. The hard parts are a traffic spike that arrives on a timetable, contests that fill to an exact
  size, and leaderboards with millions of entries changing every ball.
