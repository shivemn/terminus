flows:
- id: save
  name: Save a file
  steps:
  - text: The client splits the file into blocks of a few MB and hashes each one.
    nodes:
    - laptop
  - text: It asks which hashes the server lacks. After a small edit, usually just one.
    edges:
    - l-meta
  - text: It uploads only those blocks; storage keys them by hash, so identical blocks are stored once.
    edges:
    - l-blocks
    - blocks-store
  - text: 'It commits the new version: the file name and its list of block hashes.'
    edges:
    - l-meta
    - meta-db
- id: other
  name: Another device catches up
  steps:
  - text: The notifier tells the phone something changed.
    edges:
    - meta-notify
    - notify-phone
  - text: The phone asks for changes since the last version it knows.
    edges:
    - phone-meta
  - text: It downloads only the blocks it lacks and rebuilds the file.
    edges:
    - phone-store
- id: conflict
  name: Two edits at once
  steps:
  - text: Both devices edit the same file while offline.
    nodes:
    - laptop
    - phone
  - text: The first to commit wins. The second commit names a version that is no longer the latest, so it is refused.
    edges:
    - l-meta
    - phone-meta
  - text: The second device saves its version as a 'conflicted copy' instead of overwriting.
    nodes:
    - phone
requirements:
  features:
  - Folders that sync across devices
  - Version history
  - Sharing
  - Works offline and catches up
  qualities:
  - Never loses a file
  - Uploads only what changed
  - Edits show up on other devices in seconds
  - Exabytes stored durably
numbers:
  assumption: 'Our assumption: 100 million users storing 10 GB each.'
  rows:
  - what: Stored
    size: about 1 EB
    how: 100 million × 10 GB, before deduplication and erasure coding.
  - what: Block size
    size: 4 MB
    how: Small enough that edits upload little; large enough to keep the block count manageable.
decisions:
- title: Blocks named by hash
  text: Unchanged blocks are never sent again, and identical blocks are stored once.
- title: Metadata apart from content
  text: The file tree is small and changes often; content is huge and written once. They need different stores.
- title: Erasure coding
  text: Stores data more cheaply than full copies while surviving the loss of several disks.
breaks:
- what: Conflicting edits.
  fix: Keep both versions as a conflicted copy rather than guessing.
- what: A huge shared folder.
  fix: One change notifies thousands of devices. Batch notifications and let clients pull.
- what: Disks fail daily.
  fix: 'At exabyte scale, repair is continuous: re-create lost pieces from the erasure code.'
companies:
- name: Dropbox
  text: Its storage system, Magic Pocket, stores blocks of up to 4 MB, compressed and encrypted and named by their
    SHA-256 hash, erasure-coded across regions; it holds multiple exabytes. In 2020 it shipped Nucleus, a rewrite
    of its sync engine in Rust, to all users.
  links:
  - title: Inside the Magic Pocket
    publisher: Dropbox
    year: '2016'
    url: https://dropbox.tech/infrastructure/inside-the-magic-pocket
    verified: true
  - title: Rewriting the heart of our sync engine
    publisher: Dropbox
    year: '2020'
    url: https://dropbox.tech/infrastructure/rewriting-the-heart-of-our-sync-engine
    verified: true
