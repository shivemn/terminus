id: file-sync
title: Design file sync
like:
- Dropbox
- Google Drive
- OneDrive
level: core
summary: The client splits each file into blocks of a few MB and names each by its hash. It asks which blocks the
  server lacks, uploads only those, then commits the file as a list of hashes to a metadata service. Other devices
  hear about the change, download the blocks they don't have, and rebuild the file. The hard parts are uploading
  only what changed, conflicting edits, and storing exabytes durably.
stops:
- file-systems
- hash-tables
- partitioning-replication
- distributed-systems
- api-styles
- cryptography
