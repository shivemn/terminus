flows:
- id: hit
  name: Read, cached
  steps:
  - text: A web server asks for a key.
    edges:
    - w-r
  - text: The router hashes the key to one cache server, which returns the value.
    edges:
    - r-c
- id: miss
  name: Read, not cached
  steps:
  - text: 'The key is missing. The cache returns a lease: permission for this one server to fill it.'
    edges:
    - r-c
  - text: The web server queries the database.
    edges:
    - w-db
  - text: It sets the value with its lease. Others asking meanwhile are told to wait a moment, so the database sees
      one query, not thousands.
    edges:
    - w-r
    - r-c
- id: write
  name: Write
  steps:
  - text: The web server writes to the database.
    edges:
    - w-db
  - text: A daemon reads the committed change and sends deletes for the affected keys to every cache cluster.
    edges:
    - db-i
    - i-c
  - text: The next read misses and refills with the new value.
    edges:
    - r-c
- id: fail
  name: A cache server fails
  steps:
  - text: Requests for its keys go to a small stand-in pool instead.
    edges:
    - r-g
  - text: Misses there fill it from the database with short expiry, so the database is shielded.
    edges:
    - w-db
    nodes:
    - gutter
requirements:
  features:
  - get, set, delete by key
  - Spread across many servers
  - Survive server failures
  - Stay close to the database
  qualities:
  - Under a millisecond
  - Billions of requests a second
  - Stale data is rare and short-lived
  - The database is protected
numbers:
  assumption: 'Our assumption: 10 million reads a second with a 99% hit rate, each value about 500 bytes.'
  rows:
  - what: Database reads
    size: 100,000 a second
    how: '1% of 10 million. At 90% hit rate it would be 1 million: hit rate matters enormously.'
  - what: Memory for 1 billion items
    size: about 500 GB
    how: 1 billion × 500 bytes, spread over tens of servers.
decisions:
- title: Delete, not update
  text: Deletes are idempotent and cannot leave an older value behind; the next read refills.
- title: Look-aside
  text: The app fills the cache; the cache is never the source of truth and may evict anything.
- title: Leases
  text: On a miss only one client fills the key, preventing stale writes and stampedes.
breaks:
- what: A hot key expires.
  fix: Thousands miss at once and hit the database. Leases let one refill while others wait.
- what: A cache server dies.
  fix: Rehashing its keys would overload the others. Send them to a stand-in pool.
- what: Stale reads after writes.
  fix: Deletes can lag. Broadcast them from the commit log so none is missed.
companies:
- name: Meta (Facebook)
  text: Uses memcached as a demand-filled look-aside cache, handling billions of requests a second and trillions
    of items. Writes delete cached data rather than updating it, because deletes are idempotent. Leases stop stale
    sets and thundering herds; for one set of hot keys they cut peak database queries from 17,000 to 1,300 a second.
    A Gutter pool, about 1% of cache servers, takes over for failed ones, and daemons called mcsqueal read database
    commits and broadcast deletes.
  links:
  - title: Scaling Memcache at Facebook
    publisher: USENIX NSDI
    year: '2013'
    url: https://www.usenix.org/conference/nsdi13/technical-sessions/presentation/nishtala
    verified: true
