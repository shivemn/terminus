id: distributed-cache
title: Design a distributed cache
like:
- Memcached at Meta
- Redis
- Amazon ElastiCache
level: core
group: block
summary: Web servers ask the cache first and go to the database only on a miss, then fill the cache themselves.
  Writes go to the database and delete the cached copy rather than updating it. A router spreads keys across many
  cache servers, a stand-in pool covers servers that fail, and a daemon reading the database's commits broadcasts
  deletes. The hard parts are stale data, a stampede when a hot key expires, and failures.
stops:
- caching
- hash-tables
- sql
- messaging
- reliability-patterns
- networking
