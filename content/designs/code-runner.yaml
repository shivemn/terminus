id: code-runner
title: Design an online code runner
like:
- LeetCode
- HackerRank
- Replit
level: core
summary: A submission is queued, and a worker runs it inside a sandbox against hidden test cases, with strict limits
  on time, memory and processes and no network. The sandbox is a tiny virtual machine or a user-space kernel, so
  hostile code can't reach the host. Warm sandboxes are kept ready so runs start fast. The hard parts are isolating
  untrusted code, fair limits, and contest spikes.
