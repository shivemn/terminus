id: ad-click-counting
title: Design ad click counting
like:
- Google Ads
- Meta Ads
- Amazon Ads
level: advanced
summary: Every ad shown is logged with the search or page it came from; every click is logged by a tracker that
  redirects the person straight on. A joiner matches each click to its query in near real time, checking a shared
  registry of click IDs so no click is ever counted twice, then sends the joined events on for counting and billing.
  The hard parts are late or missing events, data-centre failures, and counting exactly once.
stops:
- messaging
- distributed-systems
- partitioning-replication
- data-warehousing
- reliability-patterns
- spark
