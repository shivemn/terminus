flows:
- id: show
  name: Show and click
  steps:
  - text: The ad server shows ads for a search and logs them under a query ID.
    edges:
    - u-a
    - a-q
  - text: A click goes to the tracker, which logs it with that query ID and redirects at once.
    edges:
    - u-c
    - c-c
- id: join
  name: Join and count
  steps:
  - text: The joiner reads each click and looks up its query to get the ad, advertiser and price.
    edges:
    - c-j
    - q-j
  - text: It checks the registry of joined click IDs. If this click is there, it is dropped.
    edges:
    - j-i
  - text: Otherwise it records the ID and sends the joined event on to be counted and billed.
    edges:
    - j-i
    - j-c
- id: late
  name: Late data and failures
  steps:
  - text: The query hasn't arrived yet. The joiner keeps the click and retries later.
    edges:
    - q-j
    nodes:
    - join
  - text: Joiners run in several data centres; the shared registry means only one of them joins each click.
    edges:
    - j-i
requirements:
  features:
  - Count impressions and clicks per ad
  - Bill advertisers
  - Near-real-time dashboards
  - Filter fraudulent clicks
  qualities:
  - Never bill a click twice
  - Almost every click counted within seconds
  - Every click counted eventually
  - Survives a data-centre outage
numbers:
  assumption: 'Our assumption: 10 billion ads shown and 200 million clicks a day.'
  rows:
  - what: Impressions
    size: about 116,000 a second
    how: 10 billion ÷ 86,400.
  - what: Clicks
    size: about 2,300 a second
    how: 200 million ÷ 86,400. Each one is money.
decisions:
- title: IDs on everything
  text: A query ID ties clicks to queries; a click ID makes counting each click once possible.
- title: Never twice, then complete
  text: Better to count a click a moment late than twice. Missing ones are filled in later.
- title: Redirect first
  text: The click tracker logs and redirects immediately; the person never waits for counting.
breaks:
- what: Duplicate clicks.
  fix: Retries and double taps. The click ID registry drops repeats.
- what: A data centre fails.
  fix: Another continues, and the shared registry keeps counts exact.
- what: Click fraud.
  fix: Bots click ads. Filter suspicious patterns before billing.
companies:
- name: Google
  text: Built Photon to join web search queries with clicks on ads, producing the logs used to bill advertisers.
    It runs across data centres and survives a whole data centre failing without manual help. It guarantees no duplicates
    in the joined output at any time, near-exact results in real time and exactly-once eventually, processing millions
    of events a minute at peak with under 10 seconds average latency.
  links:
  - title: 'Photon: fault-tolerant and scalable joining of continuous data streams'
    publisher: Google Research
    year: '2013'
    url: https://research.google/pubs/photon-fault-tolerant-and-scalable-joining-of-continuous-data-streams/
    verified: true
