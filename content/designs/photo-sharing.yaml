flows:
- id: post
  name: Post a photo
  steps:
  - text: The app uploads the full-size photo.
    edges:
    - a-up
  - text: The upload service saves the original to object storage.
    edges:
    - up-obj
  - text: It queues a job to make the smaller sizes, and answers straight away.
    edges:
    - up-q
  - text: Resizers make thumbnails and feed sizes and save them next to the original.
    edges:
    - q-res
    - res-obj
  - text: The app then sends the post itself. It gets an ID that says which shard it lives on.
    edges:
    - a-api
    - api-db
- id: scroll
  name: Scroll the feed
  steps:
  - text: The app asks for the feed. The API reads the person's list of post IDs from the cache.
    edges:
    - a-api
    - api-cache
  - text: It fetches those posts from the sharded database in one batch.
    edges:
    - api-db
  - text: The app downloads each image from the CDN at the size it needs.
    edges:
    - cdn-app
  - text: The CDN fetches an image from object storage only the first time anyone nearby asks.
    edges:
    - obj-cdn
requirements:
  features:
  - Post photos with captions
  - Follow people and see a feed
  - Like and comment
  - Profiles and photo grids
  qualities:
  - Posting feels instant
  - Images load fast anywhere
  - Photos are never lost
  - Cheap to store billions of images
numbers:
  assumption: 'Our assumption: 100 million photos a day, kept in four sizes.'
  rows:
  - what: Uploads
    size: about 1,200 a second
    how: 100 million ÷ 86,400. Several times that at peak.
  - what: New storage
    size: about 300 TB a day
    how: About 3 MB for the original and sizes together × 100 million.
  - what: Image reads
    size: hundreds of thousands a second
    how: Each photo is viewed many times, almost all served by the CDN.
decisions:
- title: Resize in the background
  text: The upload answers as soon as the original is safe; sizes are made from a queue.
- title: Photos in object storage
  text: Cheap, durable and built for huge files. The database holds only metadata.
- title: IDs that carry the shard
  text: Putting the shard number inside each ID means any server can find a row without a lookup table.
breaks:
- what: A celebrity posts.
  fix: Millions request one image. The CDN absorbs it, as long as caches are warm before the rush.
- what: The resize queue backs up.
  fix: Show the original scaled down until the sizes exist, and add workers.
- what: One shard fills up.
  fix: Start with many logical shards on few servers, and move whole shards later.
companies:
- name: Instagram
  text: Early on, photos went straight to Amazon S3 and were served through CloudFront. Redis powered the main feed
    and sessions, PostgreSQL held users and photo metadata, sharded, and slow work such as sharing went through
    a task queue (Gearman) so uploads finished quickly.
  links:
  - title: 'What powers Instagram: hundreds of instances, dozens of technologies'
    publisher: Instagram Engineering
    year: '2011'
    url: https://medium.com/instagram-engineering/what-powers-instagram-hundreds-of-instances-dozens-of-technologies-adf2e22da2ad
    verified: true
  - title: Sharding & IDs at Instagram
    publisher: Instagram Engineering
    year: '2012'
    url: https://medium.com/instagram-engineering/sharding-ids-at-instagram-1cf5a71e5a5c
    verified: true
- name: Pinterest
  text: Sharded MySQL from early 2012, starting with eight servers each replicated to a backup. Every ID is 64 bits
    holding a 16-bit shard ID, a 10-bit type and a 36-bit local ID, and 4,096 shards were opened at first.
  links:
  - title: 'Sharding Pinterest: how we scaled our MySQL fleet'
    publisher: Pinterest Engineering
    year: '2015'
    url: https://medium.com/pinterest-engineering/sharding-pinterest-how-we-scaled-our-mysql-fleet-3f341e96ca6f
    verified: true
