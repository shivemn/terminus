id: photo-sharing
title: Design a photo sharing app
like:
- Instagram
- Pinterest
level: core
summary: The app uploads the photo once; a task queue then makes the smaller sizes in the background, so posting
  feels instant. Photos live in object storage and are served from a CDN; everything else (posts, likes, follows)
  lives in a database sharded by ID. The hard parts are IDs that work across shards, keeping uploads fast, and serving
  billions of images cheaply.
