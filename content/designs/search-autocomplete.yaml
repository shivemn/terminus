id: search-autocomplete
title: Design search autocomplete
like:
- Google Search
- Amazon search
- YouTube search
level: starter
summary: Each keystroke asks for suggestions for what has been typed so far. The answers come from a prefix index
  that already holds the top few completions for every popular prefix, built offline from past searches, cleaned
  by a policy filter and nudged by what is trending right now. The hard parts are answering in tens of milliseconds,
  keeping suggestions fresh, and keeping harmful ones out.
