flows:
- id: type
  name: Type a letter
  steps:
  - text: After a short pause in typing, the box sends what has been typed so far.
    edges:
    - u-api
  - text: Very common prefixes are answered straight from a cache.
    edges:
    - api-cache
  - text: Otherwise the prefix index returns the stored top completions; no searching or sorting happens now.
    edges:
    - api-index
  - text: The box shows them, usually within about 100 ms.
    edges:
    - u-api
- id: build
  name: Build the index
  steps:
  - text: Finished searches are logged.
    edges:
    - u-logs
  - text: A batch job counts them, by language and place as well as overall.
    edges:
    - logs-build
  - text: Candidates that break the rules are removed.
    edges:
    - build-policy
  - text: The top completions for every prefix are written to a new index, which replaces the old one.
    edges:
    - policy-index
- id: trend
  name: Something is trending
  steps:
  - text: A fast job watches the last hour of searches for queries that are suddenly rising.
    edges:
    - logs-trend
  - text: It boosts them in the live index, so they appear before the next full rebuild.
    edges:
    - trend-index
requirements:
  features:
  - Suggest completions as you type
  - Different by language and place
  - Show trending searches
  - Never suggest harmful or abusive completions
  qualities:
  - Answers within about 100 ms
  - Copes with a request per keystroke
  - Fresh within minutes for news
  - Cheap per request
numbers:
  assumption: 'Our assumption: 5 billion searches a day, each sending about 4 suggestion requests.'
  rows:
  - what: Requests
    size: about 230,000 a second
    how: 20 billion ÷ 86,400. Typing pauses cut this down from one per letter.
  - what: Index size
    size: about 20 GB
    how: 100 million prefixes × 10 completions × about 20 bytes. Fits in memory, copied to many servers.
decisions:
- title: Precompute the answers
  text: Storing the top completions at every prefix turns each request into a single lookup.
- title: Batch, plus a fast lane
  text: A slow, thorough rebuild for most suggestions, and a quick job for what is trending now.
- title: Wait for a pause
  text: The box waits a moment between keystrokes before asking, which removes most requests.
breaks:
- what: Breaking news.
  fix: The batch index is hours old. The trending job fills the gap.
- what: A harmful suggestion appears.
  fix: It needs removing everywhere quickly, so the filter list is applied at serving time too.
- what: Very long queries.
  fix: Few people typed exactly that. Predict the last few words instead of the whole query.
companies:
- name: Google
  text: Predictions reflect real searches done on Google, adjusted for language and location, with freshness taken
    into account so rising topics can appear. For long queries it may predict only part of the search. Automated
    systems block predictions that break its policies, and enforcement teams remove those that slip through.
  links:
  - title: How Google autocomplete predictions are generated
    publisher: Google
    year: '2020'
    url: https://blog.google/products/search/how-google-autocomplete-predictions-work/
    verified: true
others: []
