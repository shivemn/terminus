flows:
- id: create
  name: Create a link
  steps:
  - text: The app sends the long URL, maybe with a custom alias.
    edges:
    - a-lb
    - lb-l
  - text: The link service checks the URL against malware and phishing blocklists, and that the user isn't over
      their creation limit.
    nodes:
    - links
  - text: It makes a random 7-character code, or uses the alias.
    nodes:
    - links
  - text: It inserts the row. The unique constraint rejects a duplicate code, and the service retries with a new
      one.
    edges:
    - l-store
  - text: The app gets back the short URL.
    edges:
    - lb-l
    - a-lb
- id: open
  name: Open a link
  steps:
  - text: A browser requests /aZ3kQ9x.
    edges:
    - b-lb
    - lb-r
  - text: The redirect service looks the code up in the cache. Popular links are almost always there.
    edges:
    - r-cache
  - text: On a miss it reads the row from the link store and puts it in the cache.
    edges:
    - r-store
    - r-cache
  - text: The browser gets a 302 with the long URL and goes there.
    edges:
    - lb-r
    - b-lb
  - text: A click event goes to the event log without making the browser wait.
    edges:
    - r-log
  - text: The aggregator adds it to that link's count for the day.
    edges:
    - log-agg
    - agg-stats
requirements:
  features:
  - Short link for a long URL, with an optional alias and expiry
  - Redirect anyone who opens it
  - Clicks per link per day for the owner
  - A link never changes where it points
  qualities:
  - Redirects add only milliseconds
  - Redirects almost never fail
  - Reads far outnumber writes
  - Links last for years
  - Codes can't be guessed in sequence
numbers:
  assumption: 'Our assumption: 100 million new links a month, each opened 100 times on average.'
  rows:
  - what: New links
    size: about 40 a second
    how: 100 million a month ÷ 2.6 million seconds in a month.
  - what: Redirects
    size: 4,000 a second, 20,000 at peak
    how: 100 opens × 40 new links a second. Traffic is bursty, so plan for five times that.
  - what: Code length
    size: 7 characters
    how: 62 symbols (a–z, A–Z, 0–9), so 62⁷ ≈ 3.5 trillion codes. Five years is 6 billion links.
  - what: Storage
    size: about 3 TB in five years
    how: About 500 bytes per link × 6 billion links.
  - what: Cache
    size: about 5 GB
    how: The 10 million most-clicked links at 500 bytes each.
decisions:
- title: Random codes
  text: A random code with a unique constraint needs no coordination and no guessable sequence. The cost is an occasional
    retry.
- title: 302, not 301
  text: Browsers cache a 301 forever, so clicks would go uncounted and abusive links could not be switched off.
- title: Count clicks later
  text: Sending click events to a log keeps redirects fast. Stats lag by seconds or minutes, which owners accept.
- title: Shard by code
  text: Every lookup is by code, so sharding on a hash of it spreads load with no cross-shard queries.
breaks:
- what: A link goes viral.
  fix: One cache key gets hammered. Keep a small in-memory cache on each redirect server, or copy the hot key to
    several cache nodes.
- what: Spammers create millions of links.
  fix: Rate-limit creation per account and IP, check URLs against blocklists, and rescan old links.
- what: The link store runs out of write capacity.
  fix: Shard by a hash of the code. There are no queries across links to break.
