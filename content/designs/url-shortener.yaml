id: url-shortener
title: Design a URL shortener
like:
- Bitly
- TinyURL
level: starter
summary: Creating a link stores a short random code next to the long URL. Opening the short link looks the code
  up, almost always in a cache, and answers with a redirect. Each click is sent to an event log and counted later,
  so redirects never wait for the counting. The hard parts are unique codes without coordination, a cache that absorbs
  viral links, and abuse.
