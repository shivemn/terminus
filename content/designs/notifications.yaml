flows:
- id: send
  name: Send a notification
  steps:
  - text: A service asks for a message to be sent, with a priority.
    edges:
    - svc-api
  - text: The API checks the person's preferences, such as opt-outs and quiet hours.
    edges:
    - api-prefs
  - text: It queues the message by priority and stores it until delivered.
    edges:
    - api-q
    - q-store
- id: deliver
  name: Deliver to an open app
  steps:
  - text: The delivery service takes the most urgent messages first.
    edges:
    - q-deliv
  - text: It pushes each one over the connection the app keeps open, numbered in order.
    edges:
    - deliv-app
  - text: The app acknowledges, and the stored copy is deleted.
    edges:
    - deliv-app
    - deliv-store
- id: closed
  name: The app is closed
  steps:
  - text: There is no open connection, so the message goes through Apple or Google's push service.
    edges:
    - deliv-os
  - text: It appears on the lock screen or wakes the app.
    edges:
    - os-app
  - text: When the app reconnects, it sends the last number it saw and gets anything it missed.
    edges:
    - deliv-app
    - deliv-store
requirements:
  features:
  - Push, in-app, SMS and email
  - 'Priorities: urgent before promotional'
  - Respect opt-outs and quiet hours
  - Catch up after being offline
  qualities:
  - Urgent messages in about a second
  - Never lost
  - Rarely repeated, and harmless if it is
  - Millions of connected phones
numbers:
  assumption: 'Our assumption: 100 million users receiving 20 notifications a day, with 20 million apps open at
    once.'
  rows:
  - what: Messages
    size: about 23,000 a second
    how: 2 billion ÷ 86,400. Several times that at peak, such as dinner time.
  - what: Open connections
    size: 20 million
    how: At 100,000 connections a server, about 200 delivery servers.
decisions:
- title: Push, not polling
  text: Apps asking every few seconds wastes battery and servers. A held-open connection sends only when there is
    news.
- title: Store until acknowledged
  text: A message is deleted only after the app says it arrived, so nothing is lost in a dropped connection.
- title: Numbered messages
  text: Sequence numbers let an app ask for exactly what it missed and ignore repeats.
breaks:
- what: A delivery server restarts.
  fix: Its connections all reconnect at once. Spread reconnects out with random delays.
- what: A promotional blast.
  fix: It floods the queues. Low priority waits, so urgent messages still go first.
- what: Poor mobile networks.
  fix: Connections drop silently. Heartbeats detect it, and acks decide what to resend.
companies:
- name: Uber
  text: Replaced apps polling for updates with a push platform, RAMEN, first built on server-sent events with sequence
    numbers so a reconnecting app gets what it missed, and with messages in three priority buckets. It reached more
    than 1.5 million concurrent connections and over 250,000 messages a second, then moved to gRPC bidirectional
    streaming.
  links:
  - title: Uber's real-time push platform
    publisher: Uber
    year: '2020'
