id: notifications
title: Design a notification system
like:
- Uber
- Swiggy
- WhatsApp
level: core
summary: Services hand a message to one notification API. It checks the person's preferences, queues the message
  by priority and keeps it until delivered. If the app is open it gets the message over a connection it keeps to
  the delivery service; if not, Apple or Google's push service wakes the phone. The hard parts are millions of open
  connections, ordering, and never losing or repeating a message.
