id: hotel-booking
title: Design hotel booking
like:
- Airbnb
- Booking.com
- MakeMyTrip
level: core
summary: 'Search reads a copy of availability built for speed. Booking goes to the real thing: a database row per
  room per night, held with a write that only succeeds if the night is still free. Payment carries an idempotency
  key, so a retry after a timeout can never charge twice. The hard parts are two people wanting the last room, payments
  that half-fail, and rooms also sold on other sites.'
