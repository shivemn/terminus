flows:
- id: search
  name: Search
  steps:
  - text: The guest searches a place and dates.
    edges:
    - g-search
  - text: Search checks a copy of availability built for speed. It can be seconds out of date.
    edges:
    - s-avail
- id: book
  name: Book the last room
  steps:
  - text: The guest presses book.
    edges:
    - g-book
  - text: The booking service holds the nights with a write that only succeeds if they are still free. Of two guests,
      one wins.
    edges:
    - book-db
  - text: It charges the card, sending an idempotency key made for this booking.
    edges:
    - book-pay
    - pay-bank
  - text: The booking is confirmed; if payment fails, the hold is released.
    edges:
    - g-book
    nodes:
    - db
  - text: Availability and other sites are updated.
    edges:
    - db-avail
    - db-ch
    - ch-others
- id: retry
  name: A payment times out
  steps:
  - text: The call to payments times out, and nobody knows whether the card was charged.
    edges:
    - book-pay
  - text: The booking service retries with the same key.
    edges:
    - book-pay
  - text: Payments sees the key, finds the earlier result, and returns it instead of charging again.
    nodes:
    - pay
requirements:
  features:
  - Search by place, dates and guests
  - Book and pay
  - Cancel and refund
  - Stay in step with other sites selling the same rooms
  qualities:
  - Never double-book a room
  - Never charge twice
  - Search is fast
  - Confirmed bookings are never lost
numbers:
  assumption: 'Our assumption: 1 million bookings a day, a hundred searches for each, and 1 million properties.'
  rows:
  - what: Searches
    size: about 1,200 a second
    how: 100 million ÷ 86,400, several times higher in the evening.
  - what: Bookings
    size: about 12 a second
    how: 1 million ÷ 86,400. Few writes, but each must be exactly right.
  - what: Room-nights
    size: about 1 billion rows
    how: 1 million properties × about 3 rooms × 365 nights ahead.
decisions:
- title: Search a copy, book the original
  text: Searching may be slightly stale; booking checks the real rows.
- title: A conditional write
  text: '''Mark booked only if free'' is one atomic step, so two guests can''t both get the room.'
- title: Idempotency keys
  text: Retrying a payment with the same key returns the first result instead of charging again.
breaks:
- what: A room sold elsewhere.
  fix: The hotel sold it on another site a moment earlier. Sync quickly, and re-check before confirming.
- what: Payment succeeds, then the service crashes.
  fix: On restart, the key shows the charge happened; confirm the booking rather than charging again.
- what: Popular dates.
  fix: Many guests race for few rooms. Short holds and quick release keep rooms moving.
companies:
- name: Airbnb
  text: Built Orpheus, a general-purpose idempotency library used across its payment services. Each request carries
    an idempotency key; work is split into Pre-RPC, RPC and Post-RPC phases with database commits around the call
    to another service; and errors are classed as retryable or non-retryable, so retries can't cause double payments.
  links:
  - title: Avoiding double payments in a distributed payments system
    publisher: The Airbnb Tech Blog
    year: '2019'
    url: https://medium.com/airbnb-engineering/avoiding-double-payments-in-a-distributed-payments-system-2981f6b070bb
    verified: true
