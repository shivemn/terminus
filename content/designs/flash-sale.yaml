id: flash-sale
title: Design a flash sale
like:
- Amazon Prime Day
- Shopify drops
- Flipkart Big Billion Days
level: core
summary: Product pages come from a CDN, so browsing costs almost nothing. Checkouts pass through a throttle at the
  edge that lets people in at the rate the system can take and shows everyone else a waiting page. Stock is reserved
  with one atomic decrement, and payment happens after. The hard parts are a huge spike in seconds, never selling
  more than you have, and protecting other shops on shared systems.
