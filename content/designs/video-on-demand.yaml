flows:
- id: upload
  name: Upload a video
  steps:
  - text: The creator uploads in resumable chunks, so a dropped connection loses little.
    edges:
    - c-up
  - text: The upload is saved as sent, and a catalogue entry is created.
    edges:
    - up-raw
    - up-cat
  - text: The video is split into chunks and one encode job is queued per chunk.
    edges:
    - raw-q
  - text: Encoders work on chunks in parallel, each producing a ladder of resolutions and bitrates.
    edges:
    - q-enc
  - text: Segments and playlists are saved and pushed out to CDN caches.
    edges:
    - enc-out
    - out-cdn
- id: watch
  name: Watch a video
  steps:
  - text: The player asks the playback API to play a title.
    edges:
    - v-api
  - text: The API checks rights and saved progress, picks a CDN and returns a signed playlist URL.
    edges:
    - api-cat
    - v-api
  - text: The player fetches segments from the nearest cache, switching quality as its bandwidth changes.
    edges:
    - cdn-v
requirements:
  features:
  - Upload and process videos
  - Watch on any device at the right quality
  - Resume where you left off
  - Search and browse a catalogue
  qualities:
  - Starts in a second or two
  - Rarely buffers
  - Uploads survive dropped connections
  - Bandwidth is the main cost, so keep it low
numbers:
  assumption: 'Our assumption: 500 hours of new video a minute and 100 million hours watched a day.'
  rows:
  - what: Encoding
    size: 30,000 hours a day
    how: 500 hours × 60 minutes, each encoded into many qualities.
  - what: Delivery
    size: tens of Tbps at peak
    how: 100 million hours a day at a few Mbps, concentrated in the evening.
decisions:
- title: Encode chunks in parallel
  text: A two-hour film split into short chunks encodes in minutes instead of hours.
- title: Qualities per title
  text: Simple cartoons need far fewer bits than grainy action films. Choosing qualities per title saves bandwidth.
- title: Caches inside ISPs
  text: Serving from inside the viewer's internet provider is faster and cheaper than crossing the internet.
breaks:
- what: A hit release.
  fix: Pre-position it in CDN caches before it goes live.
- what: Encoding backlog.
  fix: Encode the most-watched qualities first and the rest later.
- what: A CDN region fails.
  fix: The playback API steers players to another CDN.
companies:
- name: Netflix
  text: Replaced one fixed bitrate ladder for all titles (topping out at 5,800 kbps) with per-title encoding, which
    analyses each title's complexity to choose its qualities. Its Open Connect appliances are embedded in the networks
    of more than a thousand internet providers, at no charge to them.
  links:
  - title: Per-title encode optimization
    publisher: Netflix Technology Blog
    year: '2015'
    url: https://netflixtechblog.com/per-title-encode-optimization-7e99442b62a2
    verified: true
  - title: Netflix Open Connect
    publisher: Netflix
    year: '2026'
    url: https://openconnect.netflix.com/en/
    verified: true
- name: YouTube
  text: More than 500 hours of video are uploaded every minute on average. To transcode them, YouTube built its
    own chip and a system around it, the Video (trans)Coding Unit, with up to 20–33 times better compute efficiency
    than its previous software system.
  links:
  - title: Reimagining video infrastructure to empower YouTube
    publisher: YouTube
    year: '2021'
    url: https://blog.youtube/inside-youtube/new-era-video-infrastructure/
    verified: true
