id: video-on-demand
title: Design video on demand
like:
- YouTube
- Netflix
level: core
summary: An upload is stored as sent, then split into chunks that encoders process in parallel into a ladder of
  qualities. The results are pushed to CDN caches, many inside internet providers, and the player picks the best
  quality its connection can take, segment by segment. The hard parts are the encoding cost, choosing the right
  qualities for each video, and serving huge volumes cheaply.
