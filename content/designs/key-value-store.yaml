flows:
- id: write
  name: Write a key
  steps:
  - text: The router hashes the key to a point on the ring.
    edges:
    - a-r
  - text: It sends the write to the next three nodes on the ring.
    edges:
    - r-1
    - r-2
    - r-3
  - text: When two of the three confirm, the write succeeds; the third catches up.
    edges:
    - r-2
    - a-r
- id: read
  name: Read a key
  steps:
  - text: The router asks two of the three replicas.
    edges:
    - r-1
    - r-2
  - text: If their versions disagree, it returns the newest, or both if they conflict, and repairs the stale copy.
    edges:
    - r-2
    - a-r
- id: down
  name: A node is down
  steps:
  - text: Gossip spreads the news that replica 3 is not responding.
    edges:
    - 2-g
  - text: Its writes go to a stand-in node instead, marked as belonging to replica 3.
    nodes:
    - hint
  - text: When replica 3 returns, the stand-in hands the writes back.
    edges:
    - h-3
  - text: In the background, replicas compare hash trees of their data to find and fix any other differences.
    edges:
    - 1-2
requirements:
  features:
  - get and put by key
  - Copies in several places
  - Add and remove nodes live
  - Tunable consistency
  qualities:
  - Always accepts writes
  - Single-digit millisecond responses
  - Survives node and data-centre failures
  - Scales by adding machines
numbers:
  assumption: 'Our assumption: 1 million requests a second, 100 TB of data, 3 copies of everything.'
  rows:
  - what: Stored
    size: 300 TB
    how: 100 TB × 3 copies.
  - what: Nodes
    size: about 150
    how: 300 TB ÷ 2 TB of usable disk each.
  - what: Quorums
    size: N=3, W=2, R=2
    how: W + R > N, so every read overlaps the latest write.
  realScale:
  - name: DynamoDB
    text: peaked at 192 million requests a second during Prime Day 2026, with single-digit millisecond responses.
    source:
      title: 'All the numbers: Amazon Prime Day 2026 powered by AWS'
      publisher: AWS News Blog
      year: '2026'
      url: https://aws.amazon.com/blogs/aws/all-the-numbers-amazon-prime-day-2026-powered-by-aws/
      verified: true
decisions:
- title: Consistent hashing
  text: Adding a node moves only the keys next to it on the ring, not everything.
- title: Quorums
  text: Needing two of three copies rides out one failure while still seeing the latest write.
- title: No leader
  text: Any replica can take a write, so there is no single node whose failure stops writes.
breaks:
- what: Hot keys.
  fix: One key on one set of nodes. Cache it, or split it.
- what: Conflicting writes.
  fix: Two copies change at once. Keep version history per key and merge, or let the last write win.
- what: Uneven nodes.
  fix: Give each machine many small points on the ring so load spreads evenly.
companies:
- name: Amazon
  text: Built Dynamo so services such as the shopping cart could always write, even while disks and networks failed.
    It combined consistent hashing, vector clocks reconciled on read, a sloppy quorum with hinted handoff, anti-entropy
    using Merkle trees, and gossip-based membership; nodes can be added without manual repartitioning. DynamoDB,
    Amazon's managed NoSQL service launched in 2012, peaked at 89.2 million requests a second on Prime Day 2021.
