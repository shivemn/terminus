flows:
- id: answer
  name: Answer a message
  steps:
  - text: The app sends the message and opens a stream for the answer.
    edges:
    - a-gw
  - text: The gateway checks the person's token budget.
    edges:
    - gw-chat
  - text: Guardrails check the input.
    edges:
    - chat-guard
  - text: The chat service loads recent history and trims or summarises it to fit the context budget.
    edges:
    - chat-conv
  - text: The model gateway picks a model for the plan and task, and checks the cache.
    edges:
    - chat-mgw
  - text: 'An inference server adds the request to a running batch: it reads the prompt (prefill), then writes token
      by token (decode).'
    edges:
    - mgw-inf
  - text: Tokens stream back to the app as they're made.
    edges:
    - mgw-inf
    - chat-mgw
    - gw-chat
    - a-gw
  - text: The finished answer is saved with its token counts, and the trace is recorded.
    edges:
    - chat-conv
    - inf-traces
- id: files
  name: Ask about a file
  steps:
  - text: The person attaches a PDF. It's split into chunks and embedded into the vector index.
    edges:
    - retr-vec
  - text: On each question, retrieval finds the chunks closest to it.
    edges:
    - chat-retr
    - retr-vec
  - text: Those chunks go into the prompt with the question, and the answer cites them.
    edges:
    - chat-mgw
- id: tool
  name: Use a tool
  steps:
  - text: The model asks for a tool, say a web search, with arguments.
    edges:
    - chat-mgw
  - text: The arguments are checked, and actions with side effects need the person to confirm.
    edges:
    - chat-guard
  - text: The tool runs in a sandbox and its result goes back into the conversation.
    edges:
    - chat-tools
  - text: The model continues with the result.
    edges:
    - chat-mgw
- id: overload
  name: A launch day
  steps:
  - text: Traffic triples and GPU queues grow.
    edges:
    - mgw-inf
  - text: The model gateway sends overflow to a smaller model or an outside API provider.
    edges:
    - mgw-prov
  - text: Free-tier requests wait in a queue; paid plans keep their limits.
    edges:
    - gw-chat
requirements:
  features:
  - Answers streamed as they're written
  - Conversations saved across devices
  - Questions about uploaded files
  - Tools such as search and code
  - Plans with different models and limits
  qualities:
  - First words within about a second
  - Bounded, predictable cost per message
  - Limits counted in tokens, not requests
  - Tools can't be abused
  - Keeps working if one model fails
numbers:
  assumption: 'Our assumption: 10 million people a day sending 10 messages each, with 2,000 tokens in and 400 out
    per message.'
  rows:
  - what: Messages
    size: about 1,200 a second
    how: 100 million ÷ 86,400. About three times that at peak.
  - what: Tokens written
    size: about 460,000 a second
    how: 1,160 messages × 400 tokens.
  - what: Tokens read
    size: about 2.3 million a second
    how: 1,160 × 2,000 tokens of history and instructions. Reading is faster per token than writing.
  - what: GPUs
    size: roughly 200
    how: 'Illustration only: if one batched server writes about 2,500 tokens a second, 460,000 ÷ 2,500 ≈ 185.'
decisions:
- title: Own servers plus a fallback
  text: Self-hosted models with a serving engine give control over cost and latency; an API provider absorbs overflow.
- title: Budgets in tokens
  text: Requests vary hugely in cost. Tokens track it; request counts do not.
- title: Summarise old turns
  text: Keeps the prompt bounded and the first word fast, at some loss of detail.
- title: Batching on the GPU
  text: Serving many requests together keeps GPUs busy. The KV cache, not compute, usually limits how many fit.
breaks:
- what: A launch.
  fix: GPU queues grow. Route overflow to a smaller model or an outside provider, and queue the free tier.
- what: Long prompts.
  fix: They starve short ones. Give long-context requests separate capacity and process prompts in chunks.
- what: A poisoned web page.
  fix: It tells the model to misuse a tool. Give tools the least access they need, confirm side effects, and check
    tool arguments.
companies:
- name: vLLM
  text: 'Found serving is limited by GPU memory for the KV cache (up to 1.7 GB per sequence in LLaMA-13B), with
    60–80% wasted. PagedAttention stores it in blocks like virtual-memory pages, cutting waste below 4% and allowing
    much larger batches: up to 24 times the throughput of Hugging Face Transformers in their tests.'
  links:
  - title: 'vLLM: easy, fast, and cheap LLM serving with PagedAttention'
    publisher: vLLM team, UC Berkeley
    year: '2023'
    url: https://blog.vllm.ai/2023/06/20/vllm.html
    verified: true
- name: Hugging Face
  text: 'Documents the techniques serving systems combine: lower precision, flash attention, and caching keys and
    values so each new token reuses earlier work.'
  links:
  - title: Optimizing LLMs for speed and memory
    publisher: Hugging Face
    year: '2026'
    url: https://huggingface.co/docs/transformers/llm_tutorial_optimization
    verified: true
