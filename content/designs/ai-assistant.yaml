id: ai-assistant
title: Design an AI assistant
like:
- ChatGPT
- Claude
- Gemini
level: advanced
summary: 'A chat service assembles the prompt: recent history trimmed to fit, relevant chunks from the person''s
  files, and the new message, checked by guardrails. A model gateway picks a model and sends it to inference servers
  that batch many requests on each GPU and stream tokens back as they''re made. Tools run in a sandbox when the
  model asks. The hard parts are GPU cost and memory, the first word appearing within a second, and keeping tools
  from being misused.'
