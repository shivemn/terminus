flows:
- id: open
  name: The opening second
  steps:
  - text: Half a million people arrive at once. Each is given a place in the waiting room.
    edges:
    - u-w
  - text: The waiting room lets people in, in order, at the rate the booking system can take.
    edges:
    - w-avail
    - w-book
  - text: Availability comes from a cache a second or two old. Reads stay cheap.
    edges:
    - avail-cache
  - text: 'The booking service tries to hold seats with one conditional update: it succeeds only if enough are still
      free.'
    edges:
    - book-inv
  - text: The decrement and the hold commit together, or the answer is 'none left', quickly.
    edges:
    - book-inv
  - text: The person pays within the hold window, through the payment gateway.
    edges:
    - w-pay
    - pay-gw
  - text: If the hold is still valid, the booking is confirmed.
    edges:
    - pay-book
- id: abandon
  name: An abandoned hold
  steps:
  - text: The expiry worker finds holds past their deadline that aren't paid.
    edges:
    - exp-inv
  - text: In one transaction it marks each hold expired and returns its seats.
    edges:
    - exp-inv
  - text: If a payment arrives after expiry, it is refunded automatically.
    edges:
    - pay-gw
requirements:
  features:
  - Search and see availability
  - Hold seats while paying, released if not
  - Confirmed booking or a waitlist
  - Cancel and refund
  qualities:
  - A seat is never sold twice
  - 10 to 100 times normal traffic at opening
  - First come, first served, and bots don't win
  - Queue people politely instead of erroring
numbers:
  assumption: 'Our assumption: half a million people try to book in the first minute after a popular quota opens.'
  rows:
  - what: Requests
    size: about 40,000 a second
    how: Five requests each (search, select, hold, retry) × 500,000 ÷ 60 seconds.
  - what: Seats
    size: a few thousand
    how: 'Tiny next to demand: most answers must be ''sold out'' or ''waitlist'', fast.'
  - what: Hold
    size: 10 minutes
    how: Long enough to pay by UPI or card, short enough that abandoned holds return.
decisions:
- title: A waiting room
  text: Turns a stampede into a visible queue and keeps the booking system within the load it can take.
- title: Holds in the database
  text: A conditional update (only if seats are still free) makes overselling impossible, whatever the cache shows.
- title: Stale counts on screen
  text: Availability can lag a second or two. Correctness is enforced when the seat is held.
- title: Idempotent holds
  text: Frustrated people press again. The same key on a retry returns the same hold.
breaks:
- what: One event is too hot.
  fix: Its rows can't keep up. Split seats into pools (by coach or section) handled in parallel.
- what: Payments slow down.
  fix: Holds expire mid-payment. Extend holds for payments in flight, and refund automatically when a booking fails.
- what: Retry storms.
  fix: Idempotency keys, back-off in the app, and a visible status instead of a spinner.
companies:
- name: Cloudflare
  text: Launched its Waiting Room in 2021, first for overloaded vaccine registration sites. It queues visitors at
    the edge and lets them in as others leave, so the site stays within its limits and nobody has to start again.
  links:
  - title: Cloudflare Waiting Room
    publisher: Cloudflare
    year: '2021'
    url: https://blog.cloudflare.com/cloudflare-waiting-room/
    verified: true
- name: Stripe
  text: Uses idempotency keys so a retried request can't create a second charge.
  links:
  - title: Designing robust and predictable APIs with idempotency
    publisher: Stripe
    year: '2017'
    url: https://stripe.com/blog/idempotency
    verified: true
- name: Google
  text: Its SRE book explains how overload cascades between services, and how load shedding, graceful degradation
    and limited retries stop it.
  links:
  - title: Addressing cascading failures
    publisher: Google SRE book
    year: '2016'
    url: https://sre.google/sre-book/addressing-cascading-failures/
    verified: true
