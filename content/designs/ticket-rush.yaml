id: ticket-rush
title: Design a ticket rush
like:
- IRCTC Tatkal
- BookMyShow
- Ticketmaster
level: advanced
summary: Far more people arrive than there are seats, all at the opening second. A waiting room at the edge lets
  them in, in order, at the rate the booking system can take. Availability is shown from a cache, but a seat is
  only held by a conditional update in the database, so it can never be sold twice. Unpaid holds expire and go back
  on sale. The hard parts are contention on a handful of rows, fairness, and politely refusing most people quickly.
